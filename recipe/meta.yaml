{% set name = "flask-themes2" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 86f8c2c6aaba7330f507ba6d2e2d04ea800b3a5ce52749efa2b3c0ea78459af5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - flit-core >=3.11,<5
  run:
    - flask >=2.0
    - python >={{ python_min }}

test:
  imports:
    - flask_themes2
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/sysr-q/flask-themes2
  summary: Provides infrastructure for theming Flask applications
  license: MIT
  license_file: LICENSE
  description: |
    Flask-Themes2 is a fork of Spirits, which is in turn a fork of Flask-Themes.
  doc_url: https://flask-themes2.readthedocs.io
  dev_url: https://github.com/sysr-q/flask-themes2

extra:
  recipe-maintainers:
    - HeavyTony2
